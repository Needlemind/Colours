<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Learning Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(160deg, #fff8f0 0%, #f0f4ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }
    h1 {
      font-size: clamp(36px, 11vw, 72px);
      font-weight: 900;
      color: #333;
      text-align: center;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: clamp(18px, 5vw, 28px);
      color: #888;
      text-align: center;
      margin-bottom: 48px;
      font-weight: 500;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 760px;
    }
    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 16px;
      border-radius: 28px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.13);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      touch-action: manipulation;
    }
    .game-card:active {
      transform: scale(0.94);
      box-shadow: 0 3px 12px rgba(0,0,0,0.13);
    }
    .game-card.colours      { background: linear-gradient(135deg, #ff6b6b, #f77f00); }
    .game-card.shapes       { background: linear-gradient(135deg, #1d7fc4, #7b2d8b); }
    .game-card.letters      { background: linear-gradient(135deg, #2e9c4b, #f4b400); }
    .game-card.word-builder { background: linear-gradient(135deg, #e84393, #7b2d8b); }
    .game-card.dinosaurs    { background: linear-gradient(135deg, #2ecc71, #1abc9c); }
    .game-card.racing       { background: linear-gradient(135deg, #e74c3c, #f39c12); }
    .game-emoji {
      font-size: clamp(52px, 13vw, 80px);
      margin-bottom: 12px;
      line-height: 1;
    }
    .game-label {
      font-size: clamp(20px, 5vw, 30px);
      font-weight: 800;
      color: white;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h1>Learning Games</h1>
  <p class="subtitle">Tap a game to play!</p>
  <div class="games-grid">
    <a href="games/colours/" class="game-card colours">
      <div class="game-emoji">&#127912;</div>
      <div class="game-label">Colours</div>
    </a>
    <a href="games/shapes/" class="game-card shapes">
      <div class="game-emoji">&#128310;</div>
      <div class="game-label">Shapes</div>
    </a>
    <a href="games/letters/" class="game-card letters">
      <div class="game-emoji">&#128292;</div>
      <div class="game-label">Letters</div>
    </a>
    <a href="games/phonics/" class="game-card word-builder">
      <div class="game-emoji">&#128221;</div>
      <div class="game-label">Word Builder</div>
    </a>
    <a href="games/dinosaurs/" class="game-card dinosaurs">
      <div class="game-emoji">🦕</div>
      <div class="game-label">Dino Count!</div>
    </a>
    <a href="games/racing/" class="game-card racing">
      <div class="game-emoji">🏎️</div>
      <div class="game-label">Number Race!</div>
    </a>
  </div>
</body>
</html>
