<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Letters Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f0fff4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      user-select: none;
      touch-action: manipulation;
    }
    #home-btn {
      position: fixed;
      top: 14px;
      left: 16px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 22px;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      text-decoration: none;
    }
    #speaker-btn {
      position: fixed;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 30px;
      cursor: pointer;
      opacity: 0.6;
      z-index: 20;
    }
    #prompt-area {
      padding: 24px 20px 8px;
      text-align: center;
    }
    #tap-label {
      font-size: clamp(22px, 6vw, 36px);
      color: #555;
      font-weight: 600;
    }
    #letter-name {
      font-size: clamp(52px, 16vw, 100px);
      font-weight: 900;
      color: #2e9c4b;
      line-height: 1.1;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.08);
    }
    #letter-name.pulse { animation: pulse 0.4s ease; }
    @keyframes pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    #hint {
      font-size: clamp(18px, 5vw, 28px);
      color: #777;
      margin-top: 2px;
    }
    #grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(16px, 4vw, 32px);
      padding: clamp(12px, 3vw, 24px);
      width: 100%;
      max-width: 540px;
      flex: 1;
      align-content: center;
    }
    .letter-btn {
      border: none;
      border-radius: clamp(20px, 5vw, 36px);
      aspect-ratio: 1;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .letter-btn:active { transform: scale(0.93); box-shadow: 0 3px 10px rgba(0,0,0,0.18); }
    .letter-btn.wrong-shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(-10px); }
      40%  { transform: translateX(10px); }
      60%  { transform: translateX(-8px); }
      80%  { transform: translateX(8px); }
      100% { transform: translateX(0); }
    }
    .letter-glyph {
      font-size: clamp(48px, 14vw, 86px);
      font-weight: 900;
      color: white;
      line-height: 1;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    }
    .letter-emoji {
      font-size: clamp(20px, 6vw, 32px);
      line-height: 1;
    }
    #celebration {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.92);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #celebration.show { opacity: 1; pointer-events: all; }
    #celebration .emoji {
      font-size: clamp(80px, 22vw, 140px);
      animation: bounce 0.5s ease infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-18px) scale(1.08); }
    }
    #celebration .well-done {
      font-size: clamp(36px, 10vw, 64px);
      font-weight: 900;
      color: #333;
      margin-top: 16px;
    }
    .confetti-piece {
      position: fixed;
      animation: fall linear forwards;
      pointer-events: none;
    }
    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
    }
    #replay-btn {
      margin-top: 20px;
      font-size: clamp(22px, 6vw, 36px);
      font-weight: 800;
      padding: 16px 44px;
      border-radius: 999px;
      border: none;
      background: #2e9c4b;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(46,156,75,0.45);
      transition: transform 0.1s;
    }
    #replay-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <a href="../../" id="home-btn" aria-label="Home">&#127968;</a>
  <button id="speaker-btn" aria-label="Repeat">&#128266;</button>
  <div id="prompt-area">
    <div id="tap-label">Tap the letter</div>
    <div id="letter-name"></div>
    <div id="hint"></div>
  </div>
  <div id="grid"></div>
  <div id="celebration">
    <div class="emoji">&#11088;</div>
    <div class="well-done">Well done!</div>
    <button id="replay-btn">Next &#9654;</button>
  </div>
  <script>
    const LETTERS = [
      { l: 'A', sound: 'ah',   word: 'Apple',    emoji: '🍎' },
      { l: 'B', sound: 'buh',  word: 'Ball',     emoji: '⚽' },
      { l: 'C', sound: 'kuh',  word: 'Cat',      emoji: '🐱' },
      { l: 'D', sound: 'duh',  word: 'Dog',      emoji: '🐶' },
      { l: 'E', sound: 'eh',   word: 'Egg',      emoji: '🥚' },
      { l: 'F', sound: 'fuh',  word: 'Fish',     emoji: '🐟' },
      { l: 'G', sound: 'guh',  word: 'Goat',     emoji: '🐐' },
      { l: 'H', sound: 'huh',  word: 'Hat',      emoji: '🎩' },
      { l: 'I', sound: 'ih',   word: 'Igloo',    emoji: '🏔' },
      { l: 'J', sound: 'juh',  word: 'Jam',      emoji: '🍓' },
      { l: 'K', sound: 'kuh',  word: 'Kite',     emoji: '🪁' },
      { l: 'L', sound: 'luh',  word: 'Lion',     emoji: '🦁' },
      { l: 'M', sound: 'muh',  word: 'Moon',     emoji: '🌙' },
      { l: 'N', sound: 'nuh',  word: 'Nest',     emoji: '🪹' },
      { l: 'O', sound: 'oh',   word: 'Orange',   emoji: '🍊' },
      { l: 'P', sound: 'puh',  word: 'Penguin',  emoji: '🐧' },
      { l: 'Q', sound: 'kwuh', word: 'Queen',    emoji: '👑' },
      { l: 'R', sound: 'ruh',  word: 'Rainbow',  emoji: '🌈' },
      { l: 'S', sound: 'suh',  word: 'Sun',      emoji: '☀️' },
      { l: 'T', sound: 'tuh',  word: 'Tiger',    emoji: '🐯' },
      { l: 'U', sound: 'uh',   word: 'Umbrella', emoji: '☂️' },
      { l: 'V', sound: 'vuh',  word: 'Violin',   emoji: '🎻' },
      { l: 'W', sound: 'wuh',  word: 'Whale',    emoji: '🐳' },
      { l: 'X', sound: 'ks',   word: 'X-ray',    emoji: '🦴' },
      { l: 'Y', sound: 'yuh',  word: 'Yo-yo',    emoji: '🪀' },
      { l: 'Z', sound: 'zuh',  word: 'Zebra',    emoji: '🦓' },
    ];
    const BTN_COLORS = ['#e63946', '#1d7fc4', '#f4b400', '#2e9c4b'];
    const EMOJIS = ['🌟','🎉','🥳','⭐','🎊','✨','🦄','🌈'];
    const CELEBRATIONS = ['Well done!', 'Amazing!', 'You got it!', 'Brilliant!', 'Hooray!'];
    let target = null, blocked = false;
    const nameEl = document.getElementById('letter-name');
    const hintEl = document.getElementById('hint');
    const gridEl = document.getElementById('grid');
    const celebEl = document.getElementById('celebration');

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85; u.pitch = 1.2;
      window.speechSynthesis.speak(u);
    }

    function newRound() {
      blocked = false;
      celebEl.classList.remove('show');
      document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
      const pool = shuffle(LETTERS).slice(0, 4);
      target = pool[Math.floor(Math.random() * pool.length)];
      nameEl.textContent = target.l;
      hintEl.textContent = target.emoji + ' ' + target.word;
      gridEl.innerHTML = '';
      pool.forEach((item, i) => {
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.style.background = BTN_COLORS[i];
        btn.setAttribute('aria-label', 'Letter ' + item.l);
        btn.innerHTML = `<span class="letter-glyph">${item.l}</span><span class="letter-emoji">${item.emoji}</span>`;
        btn.addEventListener('click', () => onTap(item, btn));
        gridEl.appendChild(btn);
      });
      nameEl.classList.remove('pulse');
      void nameEl.offsetWidth;
      nameEl.classList.add('pulse');
      setTimeout(() => speak('Tap the letter ' + target.l), 300);
    }

    function onTap(item, btn) {
      if (blocked) return;
      if (item.l === target.l) {
        blocked = true;
        const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
        const msg = CELEBRATIONS[Math.floor(Math.random() * CELEBRATIONS.length)];
        celebEl.querySelector('.emoji').textContent = emoji;
        celebEl.querySelector('.well-done').textContent = msg;
        celebEl.classList.add('show');
        speak(`${target.l}! ${target.l} says ${target.sound}, like ${target.word}!`);
        launchConfetti();
      } else {
        btn.classList.remove('wrong-shake');
        void btn.offsetWidth;
        btn.classList.add('wrong-shake');
        speak('Try again! Tap the letter ' + target.l);
      }
    }

    function launchConfetti() {
      for (let i = 0; i < 60; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.cssText = `left:${Math.random()*100}vw;top:-20px;background:${BTN_COLORS[Math.floor(Math.random()*4)]};border-radius:${Math.random()>.5?'50%':'2px'};width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.6}s`;
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    document.getElementById('replay-btn').addEventListener('click', newRound);
    document.getElementById('speaker-btn').addEventListener('click', () => { if (target) speak('Tap the letter ' + target.l); });
    newRound();
  </script>
</body>
</html>
