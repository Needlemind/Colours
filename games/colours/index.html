<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Colour Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #fff8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      user-select: none;
      touch-action: manipulation;
    }

    #home-btn {
      position: fixed;
      top: 14px;
      left: 16px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 22px;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      text-decoration: none;
    }

    #prompt-area {
      padding: 24px 20px 12px;
      text-align: center;
    }

    #tap-label {
      font-size: clamp(22px, 6vw, 36px);
      color: #555;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #colour-name {
      font-size: clamp(52px, 16vw, 100px);
      font-weight: 900;
      line-height: 1.1;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.12);
      transition: transform 0.15s ease;
    }

    #colour-name.pulse {
      animation: pulse 0.4s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    #grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(16px, 4vw, 32px);
      padding: clamp(12px, 3vw, 24px);
      width: 100%;
      max-width: 540px;
      flex: 1;
      align-content: center;
    }

    .colour-btn {
      border: none;
      border-radius: clamp(20px, 5vw, 36px);
      aspect-ratio: 1;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
      position: relative;
      overflow: hidden;
    }

    .colour-btn:active {
      transform: scale(0.93);
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    .colour-btn.wrong-shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(-10px); }
      40%  { transform: translateX(10px); }
      60%  { transform: translateX(-8px); }
      80%  { transform: translateX(8px); }
      100% { transform: translateX(0); }
    }

    #celebration {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.92);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #celebration.show {
      opacity: 1;
      pointer-events: all;
    }

    #celebration .emoji {
      font-size: clamp(80px, 22vw, 140px);
      animation: bounce 0.5s ease infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-18px) scale(1.08); }
    }

    #celebration .well-done {
      font-size: clamp(36px, 10vw, 64px);
      font-weight: 900;
      color: #333;
      margin-top: 16px;
    }

    .confetti-piece {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
    }

    #replay-btn {
      margin-top: 20px;
      font-size: clamp(22px, 6vw, 36px);
      font-weight: 800;
      padding: 16px 44px;
      border-radius: 999px;
      border: none;
      background: #ff6b6b;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255,107,107,0.45);
      transition: transform 0.1s;
    }

    #replay-btn:active { transform: scale(0.95); }

    #speaker-btn {
      position: fixed;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 30px;
      cursor: pointer;
      opacity: 0.6;
      z-index: 20;
    }
  </style>
</head>
<body>

  <a href="../../" id="home-btn" aria-label="Home">&#127968;</a>
  <button id="speaker-btn" title="Repeat" aria-label="Say colour again">&#128266;</button>

  <div id="prompt-area">
    <div id="tap-label">Tap the</div>
    <div id="colour-name"></div>
  </div>

  <div id="grid"></div>

  <div id="celebration">
    <div class="emoji">&#11088;</div>
    <div class="well-done">Well done!</div>
    <button id="replay-btn">Next &#9654;</button>
  </div>

  <script>
    const COLOURS = [
      { name: 'Red',    hex: '#e63946' },
      { name: 'Blue',   hex: '#1d7fc4' },
      { name: 'Yellow', hex: '#f4b400' },
      { name: 'Green',  hex: '#2e9c4b' },
      { name: 'Orange', hex: '#f77f00' },
      { name: 'Pink',   hex: '#e84393' },
      { name: 'Purple', hex: '#7b2d8b' },
    ];

    const EMOJIS = ['🌟','🎉','🥳','⭐','🎊','✨','🦄','🌈'];
    const CELEBRATIONS = ['Well done!', 'Amazing!', 'You got it!', 'Brilliant!', 'Hooray!'];

    let target = null;
    let blocked = false;

    const nameEl    = document.getElementById('colour-name');
    const gridEl    = document.getElementById('grid');
    const celebEl   = document.getElementById('celebration');
    const replayBtn = document.getElementById('replay-btn');
    const speakerBtn = document.getElementById('speaker-btn');

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = 0.85;
      utt.pitch = 1.2;
      window.speechSynthesis.speak(utt);
    }

    function newRound() {
      blocked = false;
      celebEl.classList.remove('show');
      document.querySelectorAll('.confetti-piece').forEach(el => el.remove());

      const pool = shuffle(COLOURS);
      const shown = pool.slice(0, 4);
      target = shown[Math.floor(Math.random() * shown.length)];

      nameEl.textContent = target.name;
      nameEl.style.color = target.hex;

      gridEl.innerHTML = '';
      shown.forEach(colour => {
        const btn = document.createElement('button');
        btn.className = 'colour-btn';
        btn.style.background = colour.hex;
        btn.setAttribute('aria-label', colour.name);
        btn.dataset.name = colour.name;
        btn.addEventListener('click', () => onTap(colour, btn));
        gridEl.appendChild(btn);
      });

      nameEl.classList.remove('pulse');
      void nameEl.offsetWidth;
      nameEl.classList.add('pulse');

      setTimeout(() => speak('Tap the ' + target.name), 300);
    }

    function onTap(colour, btn) {
      if (blocked) return;
      if (colour.name === target.name) {
        blocked = true;
        celebrate();
      } else {
        btn.classList.remove('wrong-shake');
        void btn.offsetWidth;
        btn.classList.add('wrong-shake');
        speak('Try again! Tap the ' + target.name);
      }
    }

    function celebrate() {
      const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
      const msg   = CELEBRATIONS[Math.floor(Math.random() * CELEBRATIONS.length)];
      celebEl.querySelector('.emoji').textContent = emoji;
      celebEl.querySelector('.well-done').textContent = msg;
      celebEl.classList.add('show');
      speak(msg);
      launchConfetti();
    }

    function launchConfetti() {
      const colors = COLOURS.map(c => c.hex);
      for (let i = 0; i < 60; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top = '-20px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.width = (8 + Math.random() * 10) + 'px';
        el.style.height = (8 + Math.random() * 10) + 'px';
        el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        el.style.animationDelay = Math.random() * 0.6 + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    replayBtn.addEventListener('click', newRound);
    speakerBtn.addEventListener('click', () => {
      if (target) speak('Tap the ' + target.name);
    });

    newRound();
  </script>
</body>
</html>
